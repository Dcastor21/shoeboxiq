[project]
name = "shoeboxiq"
version = "0.1.0"
description = "Private, local document intake for small tax offices. Portfolio project: synthetic data only."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
# The same uv range locally and in CI (setup-uv reads this line).
required-version = ">=0.13.5,<0.14"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",  # style errors and warnings
  "F",       # unused imports, undefined names
  "I",       # import order
  "B",       # likely bugs
  "UP",      # modern Python syntax
  "S",       # security smells
  "SIM",     # simpler equivalent code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest uses plain assert; the security rule would flag it

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
